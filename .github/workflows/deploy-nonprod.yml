name: Deploy to Nonprod

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'ios/**'
      - 'infrastructure/**'
      - '.github/workflows/deploy-nonprod.yml'

env:
  AWS_REGION: us-west-2
  FIREBASE_PROJECT_ID: covey-dev

jobs:
  deploy-backend-nonprod:
    runs-on: ubuntu-latest
    name: Deploy Backend to Nonprod
    environment: nonprod
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Build backend and create Lambda package
        run: cd backend && gradle build createLambdaZip -x test

      - name: Upload Lambda package to S3
        run: |
          BUCKET="covey-lambda-deployments-dev"
          TIMESTAMP=$(date +%s)
          S3_KEY="covey-lambda-${TIMESTAMP}.zip"

          # Upload to S3 (bucket must exist and be created manually beforehand)
          aws s3 cp backend/build/distributions/covey-lambda.zip "s3://$BUCKET/$S3_KEY"

          echo "LAMBDA_S3_BUCKET=$BUCKET" >> $GITHUB_ENV
          echo "LAMBDA_S3_KEY=$S3_KEY" >> $GITHUB_ENV

      - name: Deploy Lambda function code from S3
        run: |
          aws lambda update-function-code \
            --function-name covey-weekly-spot-dev \
            --s3-bucket ${{ env.LAMBDA_S3_BUCKET }} \
            --s3-key ${{ env.LAMBDA_S3_KEY }} \
            --region ${{ env.AWS_REGION }}

          # Wait for update to complete
          aws lambda wait function-updated \
            --function-name covey-weekly-spot-dev \
            --region ${{ env.AWS_REGION }}

      - name: Configure Lambda runtime, handler and environment
        run: |
          aws lambda update-function-configuration \
            --function-name covey-weekly-spot-dev \
            --runtime java17 \
            --handler com.covey.LambdaRouter::handleRequest \
            --memory-size 1536 \
            --snap-start ApplyOn=PublishedVersions \
            --environment "Variables={GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }},FIREBASE_CREDENTIALS_SECRET=covey/firebase-admin-dev,SES_SENDER_EMAIL=${{ secrets.SES_SENDER_EMAIL || 'hello@coveyspot.app' }}}" \
            --region ${{ env.AWS_REGION }}

          aws lambda wait function-updated \
            --function-name covey-weekly-spot-dev \
            --region ${{ env.AWS_REGION }}

      - name: Verify Lambda deployment
        run: |
          aws lambda get-function \
            --function-name covey-weekly-spot-dev \
            --region ${{ env.AWS_REGION }} \
            --query 'Configuration.[FunctionName,Runtime,CodeSha256,LastModified]' \
            --output text

      - name: Publish SnapStart version and route HTTP traffic through it
        run: |
          set -euo pipefail
          FN=covey-weekly-spot-dev
          REGION=${{ env.AWS_REGION }}
          API_ID=lal06351qg
          PROXY_RESOURCE_ID=u74xpd
          STAGE=dev
          ALIAS=live

          # Publish a version; the SnapStart snapshot is created during this step.
          VERSION=$(aws lambda publish-version --function-name "$FN" --region "$REGION" --query 'Version' --output text)
          echo "Published version $VERSION"

          # Wait for the version (and its SnapStart snapshot) to become Active.
          STATE=""
          for i in $(seq 1 60); do
            STATE=$(aws lambda get-function-configuration --function-name "$FN" --qualifier "$VERSION" --region "$REGION" --query 'State' --output text)
            echo "Version $VERSION state: $STATE"
            [ "$STATE" = "Active" ] && break
            [ "$STATE" = "Failed" ] && { echo "Version failed to become active"; exit 1; }
            sleep 5
          done
          [ "$STATE" = "Active" ] || { echo "Timed out waiting for version $VERSION to become Active"; exit 1; }

          # Point the 'live' alias at the new version (create on first run).
          if aws lambda get-alias --function-name "$FN" --name "$ALIAS" --region "$REGION" >/dev/null 2>&1; then
            aws lambda update-alias --function-name "$FN" --name "$ALIAS" --function-version "$VERSION" --region "$REGION"
          else
            aws lambda create-alias --function-name "$FN" --name "$ALIAS" --function-version "$VERSION" --region "$REGION"
          fi

          # Allow API Gateway to invoke the alias (idempotent; ignore if already present).
          aws lambda add-permission --function-name "$FN" --qualifier "$ALIAS" \
            --statement-id apigw-invoke-live \
            --action lambda:InvokeFunction \
            --principal apigateway.amazonaws.com \
            --region "$REGION" 2>/dev/null || echo "invoke permission already present"

          # Repoint the API Gateway proxy integration at the alias, then redeploy the stage.
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          ALIAS_ARN="arn:aws:lambda:${REGION}:${ACCOUNT}:function:${FN}:${ALIAS}"
          URI="arn:aws:apigateway:${REGION}:lambda:path/2015-03-31/functions/${ALIAS_ARN}/invocations"
          aws apigateway update-integration \
            --rest-api-id "$API_ID" \
            --resource-id "$PROXY_RESOURCE_ID" \
            --http-method ANY \
            --patch-operations op=replace,path=/uri,value="$URI" \
            --region "$REGION"
          aws apigateway create-deployment --rest-api-id "$API_ID" --stage-name "$STAGE" --region "$REGION" >/dev/null
          echo "HTTP traffic now routed through $ALIAS -> version $VERSION"

      - name: Get API Gateway endpoint
        id: api_gateway
        run: |
          # API Gateway endpoint for dev stage
          # This routes requests to the Lambda function via API Gateway
          echo "LAMBDA_ENDPOINT=https://lal06351qg.execute-api.us-west-2.amazonaws.com/dev" >> $GITHUB_OUTPUT

      - name: Generate Firebase test token
        id: firebase_token
        run: |
          cd backend
          # Build the smoke test classes and get classpath
          gradle compileSmokeTestJava -x test

          # Get classpath for running the token generator
          CLASSPATH=$(gradle -q printClasspath)

          # Generate an ID token (custom token exchanged via Firebase REST API)
          TOKEN=$(java -cp "$CLASSPATH:build/classes/java/smokeTest:build/classes/java/main" \
            com.covey.smoke.FirebaseTestTokenGenerator smoke-test-user)
          echo "FIREBASE_TOKEN=$TOKEN" >> $GITHUB_OUTPUT
        env:
          FIREBASE_CREDENTIALS_SECRET: covey/firebase-admin-dev
          FIREBASE_WEB_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}

      - name: Run smoke tests against nonprod API Gateway
        run: |
          cd backend
          gradle smokeTest \
            -Denv=dev
        env:
          LAMBDA_ENDPOINT: ${{ steps.api_gateway.outputs.LAMBDA_ENDPOINT }}
          FIREBASE_TEST_TOKEN: ${{ steps.firebase_token.outputs.FIREBASE_TOKEN }}
        continue-on-error: true

      - name: Upload smoke test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-reports
          path: backend/build/reports/
          retention-days: 30
          if-no-files-found: warn


  deploy-ios-testflight:
    runs-on: macos-latest
    name: Deploy iOS to TestFlight (EAS)
    environment: nonprod
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'ios/package-lock.json'

      - name: Install dependencies
        run: |
          cd ios
          npm install

      - name: Set up EAS CLI
        run: npm install -g eas-cli

      - name: Build for TestFlight with EAS
        run: |
          cd ios
          eas build --platform ios --profile testflight --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to TestFlight
        run: |
          cd ios
          eas submit --platform ios --profile testflight --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  update-planning-state:
    runs-on: ubuntu-latest
    name: Update Planning State
    needs: [ deploy-backend-nonprod, deploy-ios-testflight ]
    if: success()
    steps:
      - uses: actions/checkout@v4

      - name: Update deployment timestamp
        run: |
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "Last nonprod deployment: $TIMESTAMP" >> $GITHUB_STEP_SUMMARY
